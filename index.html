<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>그라데이션 색상 코드 생성기</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f7f5fb;--card:#ffffff;--text:#241f33;--muted:#6f6a82;--line:#e3dff0;--accent:#8b5cf6;--accent-text:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#15121d;--card:#1f1b2b;--text:#eeeaf8;--muted:#9a94b0;--line:#342f45;--accent:#a78bfa;--accent-text:#15121d;}
}
:root[data-theme="dark"]{--bg:#15121d;--card:#1f1b2b;--text:#eeeaf8;--muted:#9a94b0;--line:#342f45;--accent:#a78bfa;--accent-text:#15121d;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.4rem;margin:0 0 4px}
p.sub{margin:0 0 20px;color:var(--muted);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label.t{display:block;font-size:.82rem;font-weight:600;margin-bottom:6px;color:var(--muted)}
input[type=text],textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
textarea{resize:vertical;min-height:76px}
.stops{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stop{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:4px 6px 4px 4px;background:var(--bg)}
.stop input[type=color]{width:34px;height:30px;border:none;padding:0;background:none;cursor:pointer}
.stop code{font-size:.8rem}
.stop button{border:none;background:none;color:var(--muted);cursor:pointer;font-size:1rem;line-height:1}
button.b{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:8px 12px;font:inherit;font-size:.85rem;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:12px;font-size:.88rem}
.row input[type=number]{width:60px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{width:84px;height:26px;border-radius:999px;border:1px solid var(--line);cursor:pointer}
.bar{height:14px;border-radius:7px;margin-top:12px;border:1px solid var(--line)}
.preview{border-radius:10px;padding:16px;font-size:1.25rem;font-weight:600;word-break:break-all;min-height:56px;white-space:pre-wrap}
.preview .sfx{opacity:.7;font-weight:400;font-size:.95rem}
.out{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88rem;min-height:110px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.head label.t{margin:0}
#emo{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
#emo button{border:1px solid var(--line);border-radius:10px;background:#dfe1e8;padding:2px;cursor:pointer;line-height:0}
#emo button:hover{outline:2px solid var(--accent)}
#emo img,.preview img{width:100%;height:auto;display:block;border-radius:8px}
.preview .ei{display:inline-block;width:1.6em;vertical-align:middle;margin-left:4px}
.preview .ei img{width:100%}
.foot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:24px}
#toast{font-size:.8rem;color:var(--accent);margin-left:8px}
</style>
</head>
<body>
<main>
  <h1>그라데이션 색상 코드 생성기</h1>
  <p class="sub">텍스트를 입력하면 글자마다 <code>#색상코드</code>가 붙은 그라데이션 텍스트로 바꿔줘요.</p>

  <section class="card">
    <label class="t" for="txt">텍스트</label>
    <textarea id="txt" placeholder="예) 안녕하세요~!">안녕하세요~!</textarea>
    <div style="margin-top:12px">
      <label class="t" for="sfx">뒤에 붙일 이모지 태그 (아래 이모지를 클릭하면 추가돼요)</label>
      <div style="display:flex;gap:8px"><input type="text" id="sfx" placeholder="예) [#214][#233][#255]"><button class="b" id="undo">마지막 삭제</button><button class="b" id="clr">모두 지우기</button></div>
    </div>
  </section>

  <section class="card">
    <label class="t">그라데이션 색상 (2~8개)</label>
    <div class="stops" id="stops"></div>
    <div class="bar" id="bar"></div>
    <div class="presets" id="presets"></div>
    <div class="row">
      <label>색상 변경 단위 <input type="number" id="grp" min="1" max="20" value="1"> 글자마다</label>
      <label><input type="checkbox" id="skipsp" checked> 공백에는 코드 붙이지 않기</label>
      <button class="b" id="rev">색상 순서 뒤집기</button>
    </div>
  </section>

  <section class="card">
    <label class="t">이모지 (클릭하면 태그가 추가돼요)</label>
    <div id="emo"></div>
  </section>

  <section class="card">
    <div class="head">
      <label class="t">미리보기</label>
      <label class="t" style="display:flex;align-items:center;gap:6px;margin:0">배경 <input type="color" id="pbg" value="#2b2d31" style="width:30px;height:24px;border:none;padding:0;background:none"></label>
    </div>
    <div class="preview" id="preview"></div>
  </section>

  <section class="card">
    <div class="head">
      <label class="t" for="out">결과</label>
      <span><button class="b primary" id="copy">복사하기</button><span id="toast"></span></span>
    </div>
    <textarea id="out" class="out" readonly></textarea>
  </section>
  <footer class="foot">© 2026 연운 삼평방 동맹 귀곡야. All rights reserved.</footer>
</main>

  var stops=PRESETS[0].slice();
  var $=function(id){return document.getElementById(id)};

  function hex2rgb(h){h=h.replace("#","");return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
  function rgb2hex(c){return "#"+c.map(function(v){return Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")}).join("")}
  function colorAt(t){
    if(stops.length===1)return stops[0];
    var seg=t*(stops.length-1), i=Math.min(Math.floor(seg),stops.length-2), f=seg-i;
    var a=hex2rgb(stops[i]), b=hex2rgb(stops[i+1]);
    return rgb2hex(a.map(function(v,k){return v+(b[k]-v)*f}));
  }
  function gradCss(list){return "linear-gradient(90deg,"+list.join(",")+")"}

  function renderStops(){
    var box=$("stops"); box.innerHTML="";
    stops.forEach(function(c,i){
      var d=document.createElement("div"); d.className="stop";
      var inp=document.createElement("input"); inp.type="color"; inp.value=c;
      inp.addEventListener("input",function(){stops[i]=inp.value;code.textContent=inp.value;update(true)});
      var code=document.createElement("code"); code.textContent=c;
      d.appendChild(inp); d.appendChild(code);
      if(stops.length>2){
        var x=document.createElement("button"); x.textContent="×"; x.title="삭제";
        x.addEventListener("click",function(){stops.splice(i,1);renderStops();update()});
        d.appendChild(x);
      }
      box.appendChild(d);
    });
    if(stops.length<8){
      var add=document.createElement("button"); add.className="b"; add.textContent="+ 색상 추가";
      add.addEventListener("click",function(){stops.push(stops[stops.length-1]);renderStops();update()});
      box.appendChild(add);
    }
  }

  function renderPresets(){
    var box=$("presets");
    PRESETS.forEach(function(p){
      var b=document.createElement("button"); b.className="chip";
      b.style.background=p.length>1?gradCss(p):p[0]; b.title=p.join(" → ");
      b.addEventListener("click",function(){stops=p.slice();renderStops();update()});
      box.appendChild(b);
    });
  }

  function generate(){
    var chars=Array.from($("txt").value);
    var n=Math.max(1,parseInt($("grp").value)||1);
    var skip=$("skipsp").checked;
    var isSp=function(c){return /\s/.test(c)};
    var count=0;
    chars.forEach(function(c){ if(!(skip&&isSp(c))) count++; });
    var units=Math.max(1,Math.ceil(count/n));
    var parts=[], k=-1, seen=0;
    chars.forEach(function(c){
      if(skip&&isSp(c)){parts.push({t:c,c:null});return;}
      if(seen%n===0){k++;}
      seen++;
      var col=units>1?colorAt(k/(units-1)):stops[0];
      parts.push({t:c,c:col,start:(seen-1)%n===0});
    });
    return parts;
  }

  function update(keepStops){
    $("bar").style.background=gradCss(stops.length>1?stops:[stops[0],stops[0]]);
    var parts=generate(), sfx=$("sfx").value.replace(/\s+$/,"");
    var pv=$("preview"); pv.innerHTML=""; pv.style.background=$("pbg").value;
    var out="";
    parts.forEach(function(p){
      var s=document.createElement("span"); s.textContent=p.t;
      if(p.c){s.style.color=p.c; if(p.start)out+=p.c;}
      pv.appendChild(s); out+=p.t;
    });
    if(sfx){
      out+=sfx;
      sfx.split(/(\[#\d+\])/).forEach(function(tok){
        if(!tok)return;
        var m=tok.match(/^\[#(\d+)\]$/);
        if(m&&EMO[m[1]]){var w=document.createElement("span");w.className="ei";var im=document.createElement("img");im.src=EMO[m[1]];im.alt=tok;w.appendChild(im);pv.appendChild(w);}
        else{var e=document.createElement("span");e.className="sfx";e.style.color="#ccc";e.textContent=tok;pv.appendChild(e);}
      });
    }
    $("out").value=out;
  }

  $("txt").addEventListener("input",function(){update()});
  $("sfx").addEventListener("input",function(){update()});
  $("grp").addEventListener("input",function(){update()});
  $("skipsp").addEventListener("change",function(){update()});
  $("pbg").addEventListener("input",function(){update()});
  $("rev").addEventListener("click",function(){stops.reverse();renderStops();update()});
  $("copy").addEventListener("click",function(){
    var o=$("out"), t=$("toast");
    function done(ok){t.textContent=ok?"복사됨!":"복사 실패";setTimeout(function(){t.textContent=""},1500)}
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(o.value).then(function(){done(true)},function(){o.select();try{done(document.execCommand("copy"))}catch(e){done(false)}});
    }else{o.select();try{done(document.execCommand("copy"))}catch(e){done(false)}}
  });

  function renderEmo(){
    var box=$("emo");
    Object.keys(EMO).forEach(function(c){
      var b=document.createElement("button"); b.title="[#"+c+"]";
      var im=document.createElement("img"); im.src=EMO[c]; im.alt="[#"+c+"]";
      b.appendChild(im);
      b.addEventListener("click",function(){$("sfx").value+="[#"+c+"]";update()});
      box.appendChild(b);
    });
  }
  $("clr").addEventListener("click",function(){$("sfx").value="";update()});
  $("undo").addEventListener("click",function(){$("sfx").value=$("sfx").value.replace(/\[#\d+\]\s*$|.$/,"");update()});

  renderStops(); renderPresets(); renderEmo(); update();
})();
</script>
</body>
</html>
